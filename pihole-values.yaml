# Helm values for mojo2600/pihole (chart 2.37.0, Pi-hole v6 image).
# Install / upgrade — ALWAYS pass both files (README → "Upgrading safely"):
#   helm upgrade --install pihole mojo2600/pihole -n pihole \
#     -f pihole-values.yaml -f pihole-values.local.yaml
# Admin password comes from the pre-created Secret (see README Step 3).

replicaCount: 1
# RWO volume + FTL's SQLite DB => never let two pods overlap during an upgrade
strategyType: Recreate

image:
  repository: pihole/pihole
  tag: ""              # empty = the chart's tested appVersion (a v6 image)

# Node placement — intentionally NOT set in this (committed, generic) file.
# local-path PVs carry a hard node affinity, so once the PVC is bound the pod
# can only run on that node anyway. To pick the node for the first install,
# put YOUR node name (`kubectl get nodes`) in pihole-values.local.yaml
# (gitignored), e.g.:
#   nodeSelector:
#     kubernetes.io/hostname: worker-1   # example name — replace it
# WATCH OUT: never activate a nodeSelector here with a name that matches no
# node. Recreate kills the running pod first, the new one stays Pending, and
# the whole LAN loses DNS. See README → "Upgrading safely".

persistentVolumeClaim:
  enabled: true
  size: "2Gi"          # gravity.db + FTL history; plenty with maxDBdays capped
  # storageClass omitted => default `local-path`

serviceDns:
  mixedService: true                    # one Service carrying TCP+UDP 53
  type: LoadBalancer
  loadBalancerIP: 10.0.0.53             # the network's DNS VIP. NEVER change after rollout.
  externalTrafficPolicy: Local          # preserve client IPs in the query log
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc

serviceWeb:
  type: LoadBalancer
  loadBalancerIP: 10.0.0.53             # same VIP, shared via the annotation
  externalTrafficPolicy: Local
  annotations:
    metallb.universe.tf/allow-shared-ip: pihole-svc
  http:
    enabled: true
  https:
    enabled: true                       # FTL serves a self-signed cert on 443

serviceDhcp:
  enabled: false                        # DHCP stays on the Omada gateway

admin:
  enabled: true
  existingSecret: pihole-admin
  passwordKey: password

# Upstream resolvers
DNS1: "1.1.1.1"
DNS2: "9.9.9.9"

extraEnvVars:
  TZ: "Asia/Manila"                     # ADJUST to your timezone
  # Required in Kubernetes: queries arrive on non-"local" virtual interfaces.
  # Chart default — kept explicit so nobody removes it by accident.
  FTLCONF_dns_listeningMode: "all"
  # Cap FTL's long-term query DB (days) so the PVC can't fill up.
  FTLCONF_database_maxDBdays: "91"
  # NOTE (Pi-hole v6): anything set via FTLCONF_* is read-only in the web
  # UI — this file is the single source of truth for those settings.

# The pi-hole pod itself must not depend on pi-hole for DNS (bootstrap loop).
podDnsConfig:
  enabled: true
  policy: "None"
  nameservers:
    - 127.0.0.1
    - 1.1.1.1                           # escape hatch while FTL is starting

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

podDisruptionBudget:
  enabled: false   # single replica — a PDB would only block node drains